name: Feature request
description: Suggest an improvement or new feature
title: ""
labels: ["enhancement"]
assignees: []
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to improve?
      description: What need would this address?
      placeholder: Describe the idea and who it would help.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra details (optional)
      description: Add examples, alternatives, or screenshots if useful.
    validations:
      required: false
