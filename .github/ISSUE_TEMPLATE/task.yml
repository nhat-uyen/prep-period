name: Contributor task
description: Suggest a small, scoped task for contributors
title: ""
labels: ["help wanted"]
assignees: []
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be done, and what should the result include?
      placeholder: Describe the task and how to tell it is complete.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context (optional)
      description: Add relevant files, links, or constraints.
    validations:
      required: false
