name: Bug report
about: Report a broken or unexpected behavior in Prep-Period
title: ""
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in Prep-Period. Please fill out the form below as completely as possible so we can reproduce and fix it.
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: What happened?
      placeholder: The lesson generator produced invalid math output when...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly how to trigger the issue.
      placeholder: |
        1. Open the app
        2. Enter lesson parameters...
        3. Click "Generate Lesson"
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: The app should generate a valid student and teacher lesson.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
      placeholder: The app showed an error message or returned malformed lesson data.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area affected
      description: Where did this issue occur?
      options:
        - Frontend
        - Backend
        - AI / Generation
        - Database / Persistence
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, OS, version, or model information if relevant.
      placeholder: |
        - OS: macOS 14.5
        - Browser: Chrome 127
        - Node version: 20.x
        - Python version: 3.12
        - Ollama model: llama3.1
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Add any relevant screenshots, console output, or error messages.
      placeholder: Paste logs or drag/drop screenshots here.
    validations:
      required: false
