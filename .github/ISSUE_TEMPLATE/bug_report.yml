name: Bug report
description: Report something that is broken
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce and what you expected.
      placeholder: Describe the issue and how to see it.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Details (optional)
      description: Add environment details, screenshots, or logs if useful.
    validations:
      required: false
